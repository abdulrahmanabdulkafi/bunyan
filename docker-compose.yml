# Local / standalone (single-entity) deployment. For the central multi-tenant service use the same images behind your gateway.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 10 }

  setup:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["node", "scripts/db-setup.mjs", "--demo"]
    environment:
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-change-me}@db:5432/postgres
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-change-me-owner}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-change-me-app}
    depends_on: { db: { condition: service_healthy } }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bunyan_app:${DB_APP_PASSWORD:-change-me-app}@db:5432/bunyan
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CONNECTOR_KEY: ${CONNECTOR_KEY:?set CONNECTOR_KEY}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
    depends_on: { setup: { condition: service_completed_successfully } }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      API_URL: http://api:4000
    ports: ["3000:3000"]
    depends_on: [api]

  # Optional SSO broker: federate Active Directory (LDAP) and Nafath (OIDC) here, then set OIDC_ISSUER.
  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
    ports: ["8080:8080"]

volumes:
  dbdata:
